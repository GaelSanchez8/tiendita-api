<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunix Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>
    <style>
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
</head>

<body class="bg-light">

    <main class="container py-5">
        <div class="text-center mb-4">
            <h1>Lunix </h1>
            <p class="text-muted">
                Perifericos y hardware para PC
            </p>
        </div>

        <div id="mensaje" class="alert d-none" role="alert"></div>
        <div class="row g-4">

        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body">
                        <p class="text-muted mb-1">Producto estrella</p>
                        <h3 class="h5 mb-0" id="kpiProductoEstrella">N/A</h3>
                    </div>     
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body">
                        <p class="text-muted mb-1">Ingresos totales</p>
                        <h3 class="h5 mb-0" id="kpiIngresos">$0.00</h3>
                    </div>     
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body">
                        <p class="text-muted mb-1">Transacciones</p>
                        <h3 class="h5 mb-0" id="kpiTransacciones">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card text-center shadow-sm h-100">
                    <div class="card-body">
                        <p class="text-muted mb-1">Ticket promedio</p>
                        <h3 class="h5 mb-0" id="kpiTicket">0</h3>
                    </div>
                </div>
            </div>
            <!-- Gráfico de ventas -->
        <div class="row g-4 mb-4">
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Ingresos por producto</h2>
                        <canvas id="graficoProductos"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Ventas por fecha</h2>
                        <canvas id="graficaFechas"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Compra-->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h4 mb-3">Realizar compra</h2>
                <div class="row g-3 align-items-end">
                    <div class="col-md-6">
                        <label for="selectProducto" class="form-label">Producto</label>
                        <select id="selectProducto" class="form-select"></select>
                    </div>
                    <div class="col-md-3">
                        <label for="cantidadCompra" class="form-label">Cantidad</label>
                        <input type="number" id="cantidadCompra" class="form-control" min="1" step="1" value="1">
                    </div>
                    <div class="col-md-3">
                        <button id="btnComprar" class="btn btn-primary w-100">Comprar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario para agregar productos -->
        <section class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h4 mb-3">Agregar producto</h2>

                        <form id="formProducto">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    Nombre
                                </label>
                                <input
                                    type="text"
                                    id="nombre"
                                    class="form-control"
                                    placeholder="Ej. Mouse Gamer"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="precio" class="form-label">
                                    Precio
                                </label>
                                <input
                                    type="number"
                                    id="precio"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="cantidad" class="form-label">
                                    Cantidad
                                </label>
                                <input
                                    type="number"
                                    id="cantidad"
                                    class="form-control"
                                    min="0"
                                    step="1"
                                    required
                                >
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Agregar producto
                            </button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Tabla de productos -->
            <section class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h4 mb-0">Productos</h2>
                            <span id="totalProductos" class="badge text-bg-secondary">
                                0 productos
                            </span>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Cantidad</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>

                                <tbody id="tablaProductos">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted">
                                            Cargando productos...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
    
</body>
</html>
